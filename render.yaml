services:
  - type: web
    name: shop-app-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Set this manually in the Render dashboard
      - key: JWT_SECRET
        sync: false          # Set this manually in the Render dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://shop-app-snowy.vercel.app   # Replace with your Vercel URL after deploy
      - key: PORT
        value: 4000
